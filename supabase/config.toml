# Function auth for the public market-data endpoints.
# This is not a full local-stack config. Signed-out learners call these with
# the publishable key, which is not a user JWT, so the platform JWT check is
# off. Each handler allowlists Origin and validates the ticker list.
# ask-finpath is omitted on purpose: it keeps the platform default, verify_jwt on.

[functions.market-candles]
verify_jwt = false

[functions.market-quotes]
verify_jwt = false

# Public k-anonymous aggregate for the opt-in study. The publishable key is
# not a user JWT, and signed-out learners still need to read "not enough
# participants yet". The handler allowlists Origin, requires a user JWT
# before it stores an event, and never returns individual rows.
# ask-finpath is still omitted here so the platform default stays verify_jwt on.
[functions.efficacy-summary]
verify_jwt = false
